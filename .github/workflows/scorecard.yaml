---
name: Scorecard supply-chain security
on:
  branch_protection_rule:
  schedule:
    - cron: "20 7 * * 2"
  push:
    branches:
      - main

permissions:
  contents: read
jobs:
  trigger:
    uses: statnett/github-workflows/.github/workflows/scorecard.yaml@6789e14ea4c77fed705a851e091ad9024f8c97eb # main
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
