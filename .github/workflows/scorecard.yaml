---
name: Scorecard supply-chain security
on:
  branch_protection_rule:
  schedule:
    - cron: "20 7 * * 2"
  push:
    branches:
      - main

permissions:
  contents: read
jobs:
  trigger:
    uses: statnett/github-workflows/.github/workflows/scorecard.yaml@37834049d33c16b2756f90144f3736da4d596ff8 # main
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
