---
name: Scorecard supply-chain security
on:
  branch_protection_rule:
  schedule:
    - cron: "20 7 * * 2"
  push:
    branches:
      - main

permissions:
  contents: read
jobs:
  trigger:
    uses: statnett/github-workflows/.github/workflows/scorecard.yaml@89cbb1141fe004836ee6ca584ad6f4861c2af621 # main
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
