---
name: Lint PR
on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  contents: read
jobs:
  trigger:
    uses: statnett/github-workflows/.github/workflows/lint-pr.yaml@206032886cd31cebee1e60f3b18eb7da3d5652cb # main
    permissions:
      pull-requests: write
      statuses: write
