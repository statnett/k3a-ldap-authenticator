---
name: Lint PR
on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  contents: read
jobs:
  trigger:
    uses: statnett/github-workflows/.github/workflows/lint-pr.yaml@a800c0a62cc5c55776080e3e71c45d08ac4209c7 # main
    permissions:
      pull-requests: write
      statuses: write
